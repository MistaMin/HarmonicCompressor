name: Cross-platform release builds

on:
  workflow_dispatch:
  push:
    branches: [master]
    tags: ['v*']

permissions:
  contents: read

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-24.04
            platform: linux
          - os: windows-latest
            platform: windows
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - name: Fetch pinned JUCE
        uses: actions/checkout@v4
        with:
          repository: juce-framework/JUCE
          ref: 91ad83ae34a81e0833b1a2b0866f54846370ae53
          path: JUCE
      - name: Fetch pinned GoodLookinUI
        uses: actions/checkout@v4
        with:
          repository: MistaMin/GoodLookinUI
          ref: 54ad7984b63daf4008ddc9844cb7c21f0238005a
          path: third_party/GoodLookinUI
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Linux dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y ninja-build pkg-config libasound2-dev libjack-jackd2-dev libx11-dev libxi-dev libxcomposite-dev libxcursor-dev libxext-dev libxinerama-dev libxrandr-dev libxrender-dev libfreetype-dev libfontconfig1-dev libgl1-mesa-dev libcurl4-openssl-dev libwebkit2gtk-4.1-dev xvfb
      - uses: ilammy/msvc-dev-cmd@v1
        if: runner.os == 'Windows'
      - uses: seanmiddleditch/gha-setup-ninja@v5
        if: runner.os == 'Windows'
      - name: Configure
        shell: bash
        run: cmake -S . -B build -G Ninja -DCMAKE_BUILD_TYPE=Release -DGOODLOOKINUI_ROOT="$GITHUB_WORKSPACE/third_party/GoodLookinUI" -DCMAKE_CXX_FLAGS=-D_USE_MATH_DEFINES
      - name: Build formats and regression tests
        run: cmake --build build --parallel 2 --target HarmonicCompressor_VST3 HarmonicCompressor_CLAP HarmonicCompressor_LV2 HarmonicCompressor_Standalone SliderClickTest EditorSliderTest
      - name: Test Linux sliders
        if: runner.os == 'Linux'
        run: xvfb-run -a ctest --test-dir build --output-on-failure
      - name: Test Windows sliders
        if: runner.os == 'Windows'
        run: ctest --test-dir build --output-on-failure
      - name: Rebuild manual and package
        shell: bash
        run: |
          python -m pip install reportlab
          python tools/build_user_manual.py
          python tools/package_crossplatform.py --platform ${{ matrix.platform }} --artefacts build/HarmonicCompressor_artefacts/Release --out dist
      - uses: actions/upload-artifact@v4
        with:
          name: HarmonicCompressor-${{ matrix.platform }}-x86_64
          path: |
            dist/*.zip*
            dist/*.tar.gz*
          if-no-files-found: error
